<style>

<script>
/* ---------- icônes ---------- */
const IC={flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',home:'<path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-7h6v7"/>',cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',l:'<path d="M15 5l-7 7 7 7"/>',r:'<path d="M9 5l7 7-7 7"/>',undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',dumb:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>'};
const I=(n,s=22)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

/* ---------- le perso : bonhomme filaire animé (noir sur blanc) ----------
   pose = [torse, bras(haut,avant), cuisse, tibia, pointe pied, poignet, (bras2 haut,avant, cuisse2, tibia2)]
   angles en degrés, 0 = vers le bas, + = vers l'avant. Le sol est calculé automatiquement. */
const G=128,AX={h:110,a:40},L={T:34,ua:19,fa:17,th:26,sk:25,ft:9,hd:8,hn:6};
const rd=a=>a*Math.PI/180,V=(a,l)=>[Math.sin(rd(a))*l,Math.cos(rd(a))*l],A=(p,v)=>[p[0]+v[0],p[1]+v[1]];
const N=p=>p.length>7?p:[p[0],p[1],p[2],p[3],p[4],p[5]||0,p[6]||0,p[1],p[2],p[3],p[4]];
const DA=[-90,180,180,180,90],DB=[-90,255,255,180,90,0,0,180,180,90,90],DD=[-90,180,180,90,90,0,0,255,255,180,90];
const M={
curl:{k:[[0,3,3,0,0],[0,6,150,0,0]],T:2.6,d:1},
push:{k:[[65.9,0,0,-65.9,-65.9],[75.3,-60,29,-75.3,-75.3]],T:2.4,an:1},
inc:{k:[[43.6,0,0,-43.6,-43.6],[55.3,-60,29,-55.3,-55.3]],T:2.4,an:1,bx:[88,24,26]},
fp:{k:[[-90,95,170,125,60],[-90,178,180,125,60]],T:2.6,d:1},
gob:{k:[[0,15,150,0,0],[40,30,150,95,-35]],T:2.8,d:1},
sq:{k:[[0,90,90,0,0],[40,90,90,95,-35]],T:2.8},
sumo:{k:[[0,0,0,0,0],[20,0,0,85,-25]],T:2.8,d:1},
lun:{k:[[0,0,0,0,0],[3,0,0,70,-5,0,0,0,0,-35,-75]],T:3},
calf:{k:[[0,80,90,0,0],[0,80,90,0,0,-60]],T:1.8,w:42},
tib:{k:[[-6,0,0,14,0],[-6,0,0,14,0,35]],T:1.8,w:-7},
row:{k:[[62,0,0,22,-18,0,0,28,25,22,-18],[62,-55,-5,22,-18,0,0,28,25,22,-18]],T:2.4,d:2,bx:[146,26,28]},
sup:{k:[[90,90,90,-90,-90],[80,120,120,-110,-110]],T:2.8},
wr:{k:[[35,20,85,90,0,0,-15],[35,20,85,90,0,0,50]],T:1.6,d:1,st:1},
ohp:{k:[[0,20,170,0,0],[0,175,178,0,0]],T:2.6,d:1},
lat:{k:[[0,5,5,0,0],[0,88,80,0,0]],T:2.4,d:1},
tri:{k:[[0,175,175,0,0],[0,168,340,0,0]],T:2.6,d:1},
rdl:{k:[[0,5,5,0,0],[72,0,0,12,-8]],T:3,d:1},
rw:{k:[[25,90,90,120,-35],[-20,-50,60,80,85]],T:2.6,st:1},
pl:{k:[[82.9,0,90,-82.9,-82.9],[82,0,90,-82,-82]],T:3.2,an:1},
dead:{k:[DA,DB,DA,DD,DA],T:5,c:1},
wk:{k:[[3,-25,-10,25,5,0,0,25,45,-22,-35],[3,0,15,0,0,0,0,0,15,20,-30],[3,25,45,-22,-35,0,0,-25,-10,25,5],[3,0,15,20,-30,0,0,0,15,0,0],[3,-25,-10,25,5,0,0,25,45,-22,-35]],T:1.2,c:1,l:1},
arm:{k:[[0,0,0,0,0],[0,90,90,0,0],[0,180,180,0,0],[0,270,270,0,0],[0,360,360,0,0]],T:3.2,c:1,l:1},
hip:{k:[[0,-35,40,60,-10,0,0,-35,40,0,0],[0,-35,40,-25,-40,0,0,-35,40,0,0]],T:2.4},
str:{k:[[0,178,178,0,0],[118,0,0,0,0]],T:5}
};
for(const k in M)M[k].k=M[k].k.map(N);

function pose(m,ms){const k=m.k,n=k.length;let u=ms/1000/m.T%1,s;
 if(m.c)s=u*(n-1);else{let x=u<.5?u*2:2-u*2;x=Math.min(1,Math.max(0,(x-.12)/.76));s=x*(n-1)}
 const i=Math.min(Math.floor(s),n-2);let f=s-i;if(!m.l)f=f*f*(3-2*f);
 return k[i].map((v,j)=>v+(k[i+1][j]-v)*f)}

function draw(q,m){
 const t=q[0],dT=[Math.sin(rd(t)),-Math.cos(rd(t))],hp=[0,0],
 sh=[dT[0]*L.T*.92,dT[1]*L.T*.92],nk=[dT[0]*L.T,dT[1]*L.T],hd=[dT[0]*(L.T+L.hd+2),dT[1]*(L.T+L.hd+2)],
 arm=(u,f)=>{const e=A(sh,V(u,L.ua)),h=A(e,V(f,L.fa));return [sh,e,h,A(h,V(f+q[6],L.hn))]},
 leg=(a,b)=>{const k=A(hp,V(a,L.th)),n=A(k,V(b,L.sk));return [hp,k,n,A(n,V(b+90+q[5],L.ft))]},
 a1=arm(q[1],q[2]),a2=arm(q[7],q[8]),l1=leg(q[3],q[4]),l2=leg(q[9],q[10]);
 let my=hd[1]+L.hd;[a1,a2,l1,l2].forEach(s=>s.forEach(p=>{if(p[1]>my)my=p[1]}));
 const dy=G-my,dx=m.an?AX.a-l1[2][0]:AX.h,T=p=>(p[0]+dx).toFixed(1)+','+(p[1]+dy).toFixed(1),
 pl=s=>`<polyline points="${s.map(T).join(' ')}"/>`,
 D=(s,o)=>{const g=s[2],f=s[3],n=Math.hypot(f[0]-g[0],f[1]-g[1])||1,u=[-(f[1]-g[1])/n*7,(f[0]-g[0])/n*7],c=[f[0]+dx,f[1]+dy];
  return `<g opacity="${o}" fill="#000"><path d="M${c[0]-u[0]} ${c[1]-u[1]}L${c[0]+u[0]} ${c[1]+u[1]}" stroke-width="3"/><circle cx="${c[0]-u[0]*.75}" cy="${c[1]-u[1]*.75}" r="4.6"/><circle cx="${c[0]+u[0]*.75}" cy="${c[1]+u[1]*.75}" r="4.6"/></g>`};
 let e='';
 if(m.st){const y=hp[1]+dy+4;e+=`<rect x="${AX.h-15}" y="${y}" width="32" height="${Math.max(G-y,3)}" fill="#fff" stroke-width="3"/>`}
 if(m.bx)e+=`<rect x="${m.bx[0]}" y="${G-m.bx[2]}" width="${m.bx[1]}" height="${m.bx[2]}" fill="#fff" stroke-width="3"/>`;
 if(m.w!=null)e+=`<path d="M${AX.h+m.w} ${G}V${G-112}" stroke-width="4"/>`;
 e+=`<path d="M8 ${G}H212" stroke-width="3.5"/>`;
 return `<g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">${e}<g opacity=".4" stroke-width="5">${pl(a2)}${pl(l2)}</g><g stroke-width="6.5">${pl([hp,nk])}${pl(l1)}${pl(a1)}</g><circle cx="${(hd[0]+dx).toFixed(1)}" cy="${(hd[1]+dy).toFixed(1)}" r="${L.hd}" fill="#fff" stroke-width="5"/>${m.d?D(a1,1):''}${m.d==1?D(a2,.4):''}</g>`}

let cur=null,T0=0;
function frame(ms){const el=document.getElementById('fg');if(el&&cur)el.innerHTML=draw(pose(cur,ms-T0),cur);requestAnimationFrame(frame)}

/* ---------- programme (nom, séries, reps, conseil, animation) ---------- */
const DAYS=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"],SH=["D","L","M","M","J","V","S"];
const P={
1:{n:"Pectoraux + Biceps",ex:[["Pompes classiques",3,"10","Mains un peu plus larges que les épaules, corps aligné, ne creuse pas le dos.","push"],["Développé couché au sol",3,"12","Coudes au sol, pousse les haltères vers le plafond, redescends lentement.","fp"],["Curl biceps",3,"12","Bras le long du corps, paumes vers l’avant, sans balancer.","curl"],["Curl marteau",3,"12","Paumes face à face, coudes près du corps.","curl"],["Pompes inclinées",2,"12","Mains sur un support stable, corps droit.","inc"]]},
2:{n:"Cuisses + Mollets + Tibias",ex:[["Squats avec haltère",3,"12","Haltère contre la poitrine, hanches vers l’arrière, talons au sol.","gob"],["Fentes arrière",3,"10 / jambe","Grand pas arrière, buste droit, alterne les jambes.","lun"],["Squats sumo",3,"12","Pieds très écartés, pointes vers l’extérieur.","sumo"],["Extensions mollets",3,"15","Près d’un mur, monte sur la pointe des pieds.","calf"],["Tibialis raises",3,"15","Dos au mur, talons au sol, relève les pointes.","tib"]]},
3:{n:"Dos + Avant-bras",ex:[["Rowing unilatéral",3,"12 / bras","Dos droit, tire le coude vers l’arrière.","row"],["Superman",3,"12","Sur le ventre, soulève bras et jambes, tiens 1 s.","sup"],["Curl inversé",2,"12","Paumes vers le sol, coudes près du corps.","curl"],["Flexions des poignets",2,"15","Avant-bras sur les cuisses, paumes vers le plafond.","wr"],["Extensions des poignets",2,"15","Paumes vers le sol, charge légère.","wr"]]},
4:{n:"Épaules + Triceps",ex:[["Développé épaules",3,"10","Ventre contracté, ne cambre pas le dos.","ohp"],["Élévations latérales",3,"12","Coudes légèrement pliés, jusqu’à hauteur d’épaules.","lat"],["Pompes prise rapprochée",2,"8","Coudes près du corps, genoux au sol si besoin.","push"],["Extension triceps",2,"12","Haltère à deux mains au-dessus de la tête.","tri"]]},
5:{n:"Jambes complètes",ex:[["Squats",3,"15","Hanches vers l’arrière, talons au sol.","sq"],["Fentes arrière",3,"10 / jambe","Buste droit, genoux pliés progressivement.","lun"],["Soulevé de terre roumain",3,"12","Genoux légèrement fléchis, dos neutre, hanches en arrière.","rdl"],["Extensions mollets",3,"20","Maintiens brièvement en haut.","calf"],["Tibialis raises",2,"15","Dos au mur, relève les pointes.","tib"]]},
6:{n:"Rameur + Abdos",ex:[["Rameur tranquille",1,"15 min","Jambes, buste, bras. Rythme modéré et régulier.","rw"],["Gainage",3,"30 s","Avant-bras au sol, corps aligné.","pl"],["Dead bug",3,"10 / côté","Bras droit + jambe gauche, puis alterne.","dead"],["Gainage latéral",2,"20 s / côté","Hanches levées, corps aligné.","pl"]]},
0:{n:"Récupération active",ex:[["Marche",1,"20–30 min","Rythme tranquille.","wk"],["Mobilité des épaules",1,"3–5 min","Mouvements doux.","arm"],["Mobilité des hanches",1,"3–5 min","Mouvements doux.","hip"],["Étirements doux",1,"5 min","Respire calmement.","str"]]}
};

/* ---------- état ---------- */
let S={done:{},sets:{},remind:"20:00",notified:""},tab="home",Q=null,fresh=1,rest_iv,lastDue=null;
try{const s=localStorage.getItem("muscu");if(s)S=Object.assign(S,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem("muscu",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>new Date();
function streak(){let d=today(),c=0;if(!S.done[key(d)])d=addD(d,-1);while(S.done[key(d)]){c++;d=addD(d,-1)}return c}
function best(){const ks=Object.keys(S.done).sort();let b=0,c=0,p=null;ks.forEach(k=>{const d=new Date(k+"T12:00:00");c=(p&&Math.round((d-p)/864e5)==1)?c+1:1;p=d;if(c>b)b=c});return b}
const total=()=>Object.keys(S.done).length;
function weekDates(){const t=today(),m=addD(t,-((t.getDay()+6)%7));return [0,1,2,3,4,5,6].map(i=>addD(m,i))}
const weekDone=()=>weekDates().filter(d=>S.done[key(d)]).length;
const exSets=(k,i)=>(S.sets[k]||[])[i]||0;
function sessProg(k,dow){let d=0,t=0;P[dow].ex.forEach((e,i)=>{t+=e[1];d+=Math.min(exSets(k,i),e[1])});return [d,t]}
const GOALS=[["check","1re séance",total,1],["flame","3 jours",best,3],["flame","7 jours",best,7],["flame","14 jours",best,14],["flame","30 jours",best,30],["flame","60 jours",best,60],["dumb","10 séances",total,10],["dumb","25 séances",total,25],["trophy","50 séances",total,50],["trophy","100 séances",total,100]];
const nextGoal=()=>GOALS.find(g=>g[2]()<g[3])||null;
const bar=p=>`<div class="bar"><i style="width:${Math.round(p*100)}%"></i></div>`;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const F=()=>{const r=fresh?"in":"";fresh=0;return r};
const dateStr=()=>{const n=today();return cap(n.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}))+" · "+n.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})};

/* ---------- rappels ---------- */
function setRemind(v){S.remind=v;S.notified="";save();render()}
function notify(t,b){try{navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:"icon-192.png",badge:"icon-192.png",tag:"muscu-"+key(today())}))}catch(e){try{new Notification(t,{body:b})}catch(_){}}}
function askNotif(){if(!("Notification" in window)){alert("Sur iPhone, ajoute d’abord le site à l’écran d’accueil, puis ouvre-le depuis l’icône.");return}Notification.requestPermission().then(p=>{if(p=="granted")notify("Notifications activées","Tu seras prévenu pour ta séance.");render()})}
function due(){const n=today(),p=S.remind.split(":"),t=new Date(n);t.setHours(+p[0],+p[1],0,0);return n>=t&&!S.done[key(n)]}
function tick(){const d=due();
 if(d&&S.notified!=key(today())){S.notified=key(today());save();try{if(Notification.permission=="granted")notify("C’est l’heure de ta séance",P[today().getDay()].n)}catch(e){}}
 const c=$("clk");if(c)c.textContent=dateStr();
 if(!Q&&d!==lastDue){lastDue=d;const a=document.activeElement;if(!(a&&a.tagName=="INPUT"))render()}}
function icsHref(){const p=S.remind.split(":"),n=today(),d=n.getFullYear()+String(n.getMonth()+1).padStart(2,"0")+String(n.getDate()).padStart(2,"0"),t=p[0]+p[1]+"00";
 const s=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Muscu//FR","BEGIN:VEVENT","UID:muscu-rappel@muscu","DTSTAMP:"+d+"T000000Z","DTSTART:"+d+"T"+t,"DURATION:PT1H","RRULE:FREQ=DAILY","SUMMARY:Séance de musculation","BEGIN:VALARM","TRIGGER:PT0S","ACTION:DISPLAY","DESCRIPTION:C’est l’heure de ta séance","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
 return "data:text/calendar;charset=utf-8,"+encodeURIComponent(s)}

/* ---------- séance plein écran, un exo à la fois ---------- */
function start(dow,k){const p=P[dow];let i=0;for(;i<p.ex.length;i++)if(exSets(k,i)<p.ex[i][1])break;if(i>=p.ex.length)i=0;
 stopRest();Q={dow,k,i,rest:0,rt:0,nx:0,fin:0,an:1};render()}
function quit(){stopRest();Q=null;fresh=1;tab="home";render()}
function go(d){const n=P[Q.dow].ex.length;Q.i=Math.max(0,Math.min(n-1,Q.i+d));Q.an=1;render()}
function setDone(){const p=P[Q.dow],e=p.ex[Q.i],last=Q.i==p.ex.length-1,a=S.sets[Q.k]||(S.sets[Q.k]=[]),c=a[Q.i]||0;
 if(c>=e[1]){if(last)return endSess();return go(1)}
 a[Q.i]=c+1;save();
 if(c+1>=e[1]){if(last)return endSess();if(e[1]==1||Q.dow==0)return go(1);Q.nx=1;return startRest(90)}
 startRest(60)}
function endSess(){S.done[Q.k]=1;save();stopRest();Q.fin=1;render()}
function undo(){delete S.done[key(today())];save();render()}
function startRest(s){stopRest();Q.rest=s;Q.rt=s;render();rest_iv=setInterval(()=>{Q.rest--;if(Q.rest<=0)endRest();else rupd()},1000)}
function rupd(){const r=$("rn");if(r)r.textContent=Q.rest;const c=$("rc");if(c)c.style.strokeDashoffset=(1-Q.rest/Q.rt)*339}
function addR(){Q.rest+=15;Q.rt+=15;rupd()}
function endRest(){stopRest();Q.rest=0;if(Q.nx){Q.nx=0;Q.i++;Q.an=1}render();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
function stopRest(){clearInterval(rest_iv)}

function sess(){const p=P[Q.dow],e=p.ex[Q.i],n=p.ex.length,c=Math.min(exSets(Q.k,Q.i),e[1]),f=c>=e[1],last=Q.i==n-1,an=Q.an?"sl":"";Q.an=0;
 setCur(M[e[4]]);
 let h=`<div class="sv"><div class="top"><button class="x" onclick="quit()">${I("x",20)}</button><div class="seg">${p.ex.map((x,j)=>`<i class="${exSets(Q.k,j)>=x[1]?"d":""} ${j==Q.i?"c":""}"></i>`).join("")}</div><b class="cnt">${Q.i+1}/${n}</b></div>
<div class="stage ${an}"><svg id="fg" viewBox="0 0 220 150"></svg>${Q.i>0?`<button class="nav l" onclick="go(-1)">${I("l")}</button>`:""}${!last?`<button class="nav r" onclick="go(1)">${I("r")}</button>`:""}</div>
<div class="info ${an}"><h2 class="en">${e[0]}</h2><div class="pill">${e[1]} × ${e[2]}</div><p class="tip">${e[3]}</p><div class="dots">${Array.from({length:e[1]},(_,j)=>`<span class="dt ${j<c?"on":""}">${j<c?I("check",22):j+1}</span>`).join("")}</div></div>
<button class="btn ${f?"":"pulse"}" onclick="setDone()">${f?(last?I("trophy",22)+" Terminer":"Exo suivant "+I("r",20)):I("check",22)+(e[1]==1?" C’est fait":" Série "+(c+1)+" faite")}</button></div>`;
 if(Q.rest>0){const nx=Q.nx&&p.ex[Q.i+1]?p.ex[Q.i+1][0]:null;
  h+=`<div class="rest"><div class="lbl">Repos</div><div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle id="rc" class="fg" cx="60" cy="60" r="54" style="stroke-dashoffset:${(1-Q.rest/Q.rt)*339}"/></svg><b id="rn">${Q.rest}</b></div><div>${nx?"Ensuite : <b>"+nx+"</b>":"Respire, prépare la série suivante"}</div><div class="rb"><button class="btn sm" onclick="addR()">+15 s</button><button class="btn sm k" onclick="endRest()">Passer</button></div></div>`}
 return h}
function finHTML(){setCur(null);const s=streak(),cs=["#ffd60a","#ff5a36","#fff","#9db4ff","#7ee2a8"];
 return `<div class="fin">${Array.from({length:26},(_,i)=>{const r=Math.random();return `<i class="cf" style="left:${Math.round(r*100)}%;background:${cs[i%5]};animation-duration:${(2+Math.random()*2).toFixed(2)}s;animation-delay:${(-Math.random()*3).toFixed(2)}s"></i>`}).join("")}<div class="tro">${I("trophy",110)}</div><h2 class="h">Séance<br>terminée !</h2><div class="big">${s}${I("flame",44)}</div><div>jour${s>1?"s":""} de série · reviens demain</div><button class="btn" style="max-width:340px;background:#fff" onclick="quit()">Continuer</button></div>`}

/* ---------- écrans ---------- */
function setCur(m){if(m!==cur){cur=m;T0=performance.now()}}
function home(){const n=today(),k=key(n),d=n.getDay(),s=streak(),g=nextGoal(),p=P[d],dn=!!S.done[k],gv=g?Math.min(g[2](),g[3]):0;
 setCur(M[p.ex[0][4]]);
 return `<div class="view ${F()}"><div class="hd"><div class="mu" id="clk">${dateStr()}</div><h1 class="h">Prêt à suer ?</h1></div>
${due()?`<div class="ban box">${I("bell",20)}<span>C’est l’heure : ${p.n.toLowerCase()}</span></div>`:""}
<div class="box stage"><svg id="fg" viewBox="0 0 220 150"></svg><span class="chip a">${DAYS[d]} · ${p.n}</span><span class="chip b">${p.ex[0][0]}</span>${dn?`<button class="chip c" onclick="undo()">${I("undo",13)} annuler</button>`:""}</div>
<div class="st"><div class="box s1"><b>${s}${I("flame",22)}</b><span>jour${s>1?"s":""} de série</span></div><div class="box s2"><b>${weekDone()}/7</b><span>cette semaine</span></div><div class="box s3"><b>${gv}/${g?g[3]:"–"}</b><span>${g?"Objectif : "+g[1]:"Tout est fait !"}</span></div></div>
<div class="week">${weekDates().map(x=>{const kk=key(x);return `<div class="day ${S.done[kk]?"done":""} ${kk==k?"today":""}" onclick="start(${x.getDay()},'${kk}')">${SH[x.getDay()]}<b>${x.getDate()}</b></div>`}).join("")}</div>
<button class="btn ${dn?"":"pulse"}" onclick="start(${d},'${k}')">${dn?I("check")+" Revoir la séance":I("play",20)+" Lancer la séance"}</button></div>`}
function seances(){setCur(null);const tk=key(today());
 return `<div class="view ${F()}"><div class="hd"><h1 class="h">Séances</h1><div class="mu">Touche une séance pour la lancer</div></div><div class="list">${weekDates().map(x=>{const kk=key(x),d=x.getDay(),pr=sessProg(kk,d),pc=S.done[kk]?100:Math.round(pr[0]/pr[1]*100);
  return `<div class="box tap row ${kk==tk?"td":""}" style="--p:${pc}%" onclick="start(${d},'${kk}')"><div><b>${DAYS[d]}</b><small>${P[d].n}</small></div><div class="rw2">${S.done[kk]?I("check",24):pr[0]+"/"+pr[1]}</div></div>`}).join("")}</div></div>`}
function goals(){setCur(null);const np="Notification" in window?Notification.permission:"off";
 return `<div class="view ${F()}"><div class="hd"><h1 class="h">Objectifs</h1><div class="mu">Série ${streak()} · Record ${best()} · Séances ${total()}</div></div>
<div class="meds">${GOALS.map(g=>{const v=g[2](),got=v>=g[3];return `<div class="med ${got?"got":""}"><div class="mt"><span class="ic">${I(g[0],20)}</span><b>${g[1]}</b></div><div class="mu">${Math.min(v,g[3])}/${g[3]}</div>${bar(Math.min(v,g[3])/g[3])}</div>`}).join("")}</div>
<div class="box rem"><span>${I("bell",20)} Rappel</span><input type="time" value="${S.remind}" onchange="setRemind(this.value)"><button class="ib" title="Notifications" onclick="askNotif()">${I(np=="granted"?"check":"bell",20)}</button><a class="ib" title="Ajouter au calendrier" href="${icsHref()}">${I("cal",20)}</a></div></div>`}
function setTab(t){tab=t;fresh=1;render()}
function render(){const a=$("app"),s=$("ss");
 if(Q){a.style.display="none";s.style.display="block";s.innerHTML=Q.fin?finHTML():sess()}
 else{s.style.display="none";s.innerHTML="";a.style.display="flex";
  const t=(n,l,ic)=>`<button class="${tab==n?"on":""}" onclick="setTab('${n}')">${I(ic,22)}<span>${l}</span></button>`;
  a.innerHTML=(tab=="home"?home():tab=="seances"?seances():goals())+`<div class="tabs">${t("home","Accueil","home")}${t("seances","Séances","cal")}${t("goals","Objectifs","trophy")}</div>`}}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
render();tick();setInterval(tick,30000);requestAnimationFrame(frame);
</script></body></html>
