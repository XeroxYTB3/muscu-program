<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muscu">
<meta name="theme-color" content="#0d1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Muscu</title>
<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#161a2e;--mu:#6b7090;--ac:#ff6a3d;--ac2:#ff3d7f;--ok:#22c55e;--ln:#e4e6f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1020;--card:#171b31;--tx:#f2f3fb;--mu:#9a9fc4;--ln:#262b4d}}
:root[data-theme="dark"]{--bg:#0d1020;--card:#171b31;--tx:#f2f3fb;--mu:#9a9fc4;--ln:#262b4d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:18px 18px 110px}
h1{font-size:28px;letter-spacing:-.5px;margin:4px 0 2px}h2{font-size:17px;margin:24px 0 10px}
.mu{color:var(--mu);font-size:14px}
.i{vertical-align:-4px;flex:none}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--ln)}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:26px;padding:22px;margin:16px 0}
.hero .big{font-size:48px;font-weight:800;line-height:1;letter-spacing:-1px;display:flex;align-items:center;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer}
.btn.w{background:#fff;color:#ff3d7f;margin-top:16px}.btn:disabled{opacity:.4}
.week{display:flex;gap:6px}
.day{flex:1;text-align:center;padding:9px 0;border-radius:14px;background:var(--card);border:1px solid var(--ln);font-size:12px;color:var(--mu);cursor:pointer}
.day b{display:block;font-size:17px;color:var(--tx);margin-top:2px}
.day.today{border:2px solid var(--ac)}.day.done{background:var(--ok);border-color:var(--ok);color:#fff}.day.done b{color:#fff}
.bar{height:8px;border-radius:8px;background:var(--ln);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:8px;transition:width .3s}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.dots{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.dot{width:46px;height:46px;border-radius:50%;border:2px solid var(--ln);background:none;color:var(--mu);font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dot.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ex.fin{opacity:.6}.tip{font-size:13px;color:var(--mu);margin:6px 0 0;line-height:1.45}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:none;border:0;color:var(--mu);font-size:12px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs .on{color:var(--ac);font-weight:700}
.goal{display:flex;gap:12px;align-items:center}
.goal .ico{width:42px;height:42px;border-radius:13px;background:var(--ln);color:var(--mu);display:flex;align-items:center;justify-content:center;flex:none}
.goal.got .ico{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}.goal .bar{margin-top:8px}
.ban{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--ac);color:var(--tx);border-radius:16px;padding:12px 14px;margin:8px 0;font-weight:600}
.ban .i{color:var(--ac)}
#rest{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#161a2e;color:#fff;border-radius:18px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;font-weight:700;z-index:5}
#rest button{background:#ffffff22;color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:14px}
.back{background:none;border:0;color:var(--ac);font-size:16px;padding:6px 0;cursor:pointer;display:flex;align-items:center;gap:2px}
input[type=time]{font-size:18px;padding:8px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.sbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:12px;border-radius:14px;border:1px solid var(--ln);background:none;color:var(--tx);font-size:15px;font-weight:600;text-decoration:none;cursor:pointer}
</style></head><body>
<div id="app"></div><div id="rest"><span id="rt"></span><button onclick="stopRest()">Passer</button></div>
<script>
var IC={flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',home:'<path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-7h6v7"/>',cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',back:'<path d="M15 5l-7 7 7 7"/>',dumb:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'};
function I(n,s){return '<svg class="i" width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+IC[n]+'</svg>'}
var DAYS=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"],SH=["D","L","M","M","J","V","S"];
var P={
1:{n:"Pectoraux + Biceps",ex:[["Pompes classiques",3,"10","Mains un peu plus larges que les épaules, corps aligné, ne creuse pas le dos."],["Développé couché au sol",3,"12","Coudes au sol, pousse les haltères vers le plafond, redescends lentement."],["Curl biceps",3,"12","Bras le long du corps, paumes vers l’avant, sans balancer."],["Curl marteau",3,"12","Paumes face à face, coudes près du corps."],["Pompes inclinées",2,"12","Mains sur un support stable, corps droit."]]},
2:{n:"Cuisses + Mollets + Tibias",ex:[["Squats avec haltère",3,"12","Haltère contre la poitrine, hanches vers l’arrière, talons au sol."],["Fentes arrière",3,"10 / jambe","Grand pas arrière, buste droit, alterne les jambes."],["Squats sumo",3,"12","Pieds très écartés, pointes vers l’extérieur."],["Extensions mollets",3,"15","Près d’un mur, monte sur la pointe des pieds."],["Tibialis raises",3,"15","Dos au mur, talons au sol, relève les pointes."]]},
3:{n:"Dos + Avant-bras",ex:[["Rowing unilatéral",3,"12 / bras","Dos droit, tire le coude vers l’arrière."],["Superman",3,"12","Sur le ventre, soulève bras et jambes, tiens 1 s."],["Curl inversé",2,"12","Paumes vers le sol, coudes près du corps."],["Flexions des poignets",2,"15","Avant-bras sur les cuisses, paumes vers le plafond."],["Extensions des poignets",2,"15","Paumes vers le sol, charge légère."]]},
4:{n:"Épaules + Triceps",ex:[["Développé épaules",3,"10","Ventre contracté, ne cambre pas le dos."],["Élévations latérales",3,"12","Coudes légèrement pliés, jusqu’à hauteur d’épaules."],["Pompes prise rapprochée",2,"8","Coudes près du corps, genoux au sol si besoin."],["Extension triceps",2,"12","Haltère à deux mains au-dessus de la tête."]]},
5:{n:"Jambes complètes",ex:[["Squats",3,"15","Hanches vers l’arrière, talons au sol."],["Fentes arrière",3,"10 / jambe","Buste droit, genoux pliés progressivement."],["Soulevé de terre roumain",3,"12","Genoux légèrement fléchis, dos neutre, hanches en arrière."],["Extensions mollets",3,"20","Maintiens brièvement en haut."],["Tibialis raises",2,"15","Dos au mur, relève les pointes."]]},
6:{n:"Rameur + Abdos",ex:[["Rameur tranquille",1,"15 min","Jambes, buste, bras. Rythme modéré et régulier."],["Gainage",3,"30 s","Avant-bras au sol, corps aligné."],["Dead bug",3,"10 / côté","Bras droit + jambe gauche, puis alterne."],["Gainage latéral",2,"20 s / côté","Hanches levées, corps aligné."]]},
0:{n:"Récupération active",ex:[["Marche",1,"20–30 min","Rythme tranquille."],["Mobilité des épaules",1,"3–5 min","Mouvements doux."],["Mobilité des hanches",1,"3–5 min","Mouvements doux."],["Étirements doux",1,"5 min","Respire calmement."]]}
};
var S={done:{},sets:{},remind:"20:00",notified:""},tab="home",sel=null,rv=null,showModal=false,rest_iv;
try{var _s=localStorage.getItem("muscu");if(_s)S=Object.assign(S,JSON.parse(_s))}catch(e){}
function save(){try{localStorage.setItem("muscu",JSON.stringify(S))}catch(e){}}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function today(){return new Date()}
function streak(){var d=today(),c=0;if(!S.done[key(d)])d=addD(d,-1);while(S.done[key(d)]){c++;d=addD(d,-1)}return c}
function best(){var ks=Object.keys(S.done).sort(),b=0,c=0,p=null;ks.forEach(function(k){var d=new Date(k+"T12:00:00");c=(p&&Math.round((d-p)/864e5)==1)?c+1:1;p=d;if(c>b)b=c});return b}
function total(){return Object.keys(S.done).length}
function weekDates(){var t=today(),m=addD(t,-((t.getDay()+6)%7)),a=[];for(var i=0;i<7;i++)a.push(addD(m,i));return a}
function weekDone(){return weekDates().filter(function(d){return S.done[key(d)]}).length}
function exSets(k,i){return (S.sets[k]||[])[i]||0}
function sessProg(k,dow){var d=0,t=0;P[dow].ex.forEach(function(e,i){t+=e[1];d+=Math.min(exSets(k,i),e[1])});return [d,t]}
var GOALS=[["check","Première séance",total,1],["flame","3 jours d’affilée",best,3],["flame","Semaine parfaite : 7 jours",best,7],["flame","14 jours d’affilée",best,14],["flame","30 jours d’affilée",best,30],["flame","60 jours d’affilée",best,60],["dumb","10 séances",total,10],["dumb","25 séances",total,25],["trophy","50 séances",total,50],["trophy","100 séances",total,100]];
function nextGoal(){for(var i=0;i<GOALS.length;i++)if(GOALS[i][2]()<GOALS[i][3])return GOALS[i];return null}
function bar(p){return '<div class="bar"><i style="width:'+Math.round(p*100)+'%"></i></div>'}
function setTab(t){tab=t;sel=null;render()}
function openDay(dow,k){sel={dow:dow,k:k};render();scrollTo(0,0)}
function tap(i,j){var a=S.sets[sel.k]||(S.sets[sel.k]=[]),c=a[i]||0,n=(c==j+1)?j:j+1;a[i]=n;save();var ex=P[sel.dow].ex[i];
 if(n>c&&!(n>=ex[1]&&i==P[sel.dow].ex.length-1)&&ex[1]>1)startRest(n>=ex[1]?90:60);render()}
function finish(){S.done[sel.k]=1;save();showModal=true;stopRest();render()}
function undo(){delete S.done[sel.k];save();render()}
function startRest(s){stopRest();rv=s;document.getElementById("rest").style.display="flex";upd();rest_iv=setInterval(function(){rv--;if(rv<=0){stopRest();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}else upd()},1000)}
function upd(){document.getElementById("rt").innerHTML=I("timer",20)+" Repos : "+rv+" s"}
function stopRest(){clearInterval(rest_iv);document.getElementById("rest").style.display="none"}
function setRemind(v){S.remind=v;S.notified="";save();render()}
function notify(t,b){try{navigator.serviceWorker.ready.then(function(r){r.showNotification(t,{body:b,icon:"icon-192.png",badge:"icon-192.png",tag:"muscu-"+key(today())})})}catch(e){try{new Notification(t,{body:b})}catch(_){}}}
function askNotif(){if(!("Notification" in window)){alert("Sur iPhone, ajoute d’abord le site à l’écran d’accueil, puis ouvre-le depuis l’icône.");return}Notification.requestPermission().then(function(p){if(p=="granted")notify("Notifications activées","Tu seras prévenu pour ta séance.");render()})}
function due(){var n=today(),p=S.remind.split(":"),t=new Date(n);t.setHours(+p[0],+p[1],0,0);return n>=t&&!S.done[key(n)]}
function tick(){if(due()&&S.notified!=key(today())){S.notified=key(today());save();try{if(Notification.permission=="granted")notify("C’est l’heure de ta séance",P[today().getDay()].n)}catch(e){}}
 var a=document.activeElement;if(!(a&&a.tagName=="INPUT"))render()}
function icsHref(){var p=S.remind.split(":"),n=today(),d=n.getFullYear()+String(n.getMonth()+1).padStart(2,"0")+String(n.getDate()).padStart(2,"0"),t=p[0]+p[1]+"00";
 var s=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Muscu//FR","BEGIN:VEVENT","UID:muscu-rappel@muscu","DTSTAMP:"+d+"T000000Z","DTSTART:"+d+"T"+t,"DURATION:PT1H","RRULE:FREQ=DAILY","SUMMARY:Séance de musculation","BEGIN:VALARM","TRIGGER:PT0S","ACTION:DISPLAY","DESCRIPTION:C’est l’heure de ta séance","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
 return "data:text/calendar;charset=utf-8,"+encodeURIComponent(s)}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function home(){var n=today(),k=key(n),d=n.getDay(),s=streak(),g=nextGoal(),h="";
 h+='<div class="mu">'+cap(n.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}))+' · '+n.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})+'</div><h1>Prêt pour ta séance</h1>';
 if(due())h+='<div class="ban">'+I("bell")+'<span>C’est l’heure : '+P[d].n.toLowerCase()+'</span></div>';
 h+='<div class="hero"><div class="row"><div><div class="big">'+s+I("flame",40)+'</div><div>jour'+(s>1?"s":"")+' de série</div></div><div style="text-align:right"><div style="font-size:28px;font-weight:800">'+weekDone()+'/7</div><div>cette semaine</div></div></div>';
 if(g){var v=Math.min(g[2](),g[3]);h+='<div style="margin-top:16px;font-size:14px;opacity:.95">Prochain objectif : '+g[1]+' ('+v+'/'+g[3]+')</div><div class="bar" style="background:#fff4"><i style="width:'+Math.round(v/g[3]*100)+'%;background:#fff"></i></div>'}
 h+='<button class="btn w" onclick="openDay('+d+',\''+k+'\')">'+(S.done[k]?I("check")+" Séance faite, revoir":I("play",20)+" Lancer la séance du jour")+'</button></div>';
 h+='<div class="week">'+weekDates().map(function(x){var kk=key(x),c="day"+(S.done[kk]?" done":"")+(kk==k?" today":"");return '<div class="'+c+'" onclick="openDay('+x.getDay()+',\''+kk+'\')">'+SH[x.getDay()]+'<b>'+x.getDate()+'</b></div>'}).join("")+'</div>';
 h+='<h2>Aujourd’hui : '+P[d].n+'</h2><div class="card mu">'+P[d].ex.length+' exercices · 40 à 60 minutes. N’oublie pas l’échauffement de 5 à 10 minutes.</div>';return h}
function session(){var dow=sel.dow,k=sel.k,p=P[dow],pr=sessProg(k,dow),ok=pr[0]==pr[1],h='<button class="back" onclick="sel=null;render()">'+I("back",20)+' Retour</button><h1>'+p.n+'</h1><div class="mu">'+DAYS[dow]+' · '+pr[0]+'/'+pr[1]+' séries</div>'+bar(pr[0]/pr[1]);
 if(dow!=0)h+='<div class="card mu" style="margin-top:14px">Échauffement : 5 à 10 minutes. Repos de 60 à 90 secondes entre les séries.</div>';
 p.ex.forEach(function(e,i){var c=exSets(k,i),f=c>=e[1];h+='<div class="card ex'+(f?" fin":"")+'" style="margin-top:'+(i||dow!=0?0:14)+'px"><div class="row"><b>'+e[0]+'</b><span class="mu">'+e[1]+' × '+e[2]+'</span></div><div class="tip">'+e[3]+'</div><div class="dots">';
  for(var j=0;j<e[1];j++)h+='<button class="dot'+(j<c?" on":"")+'" onclick="tap('+i+','+j+')">'+(e[1]==1||j<c?I("check",20):j+1)+'</button>';h+='</div></div>'});
 return h+(S.done[k]?'<button class="btn" style="background:var(--mu)" onclick="undo()">Annuler « séance faite »</button>':'<button class="btn" '+(ok?"":"disabled")+' onclick="finish()">'+I("check")+' Terminer la séance</button>')}
function seances(){var h="<h1>Séances</h1><div class='mu'>Touche une séance pour la lancer.</div><div style='height:14px'></div>";
 weekDates().forEach(function(x){var kk=key(x),d=x.getDay(),pr=sessProg(kk,d);h+='<div class="card" onclick="openDay('+d+',\''+kk+'\')" style="cursor:pointer"><div class="row"><div><b>'+DAYS[d]+'</b><div class="mu">'+P[d].n+'</div></div><div class="mu">'+(S.done[kk]?'<span style="color:var(--ok)">'+I("check")+'</span>':pr[0]+"/"+pr[1])+'</div></div>'+bar(S.done[kk]?1:pr[0]/pr[1])+'</div>'});return h}
function goals(){var h="<h1>Objectifs</h1><div class='mu'>Série : "+streak()+" · Record : "+best()+" · Séances : "+total()+"</div><div style='height:14px'></div>";
 GOALS.forEach(function(g){var v=g[2](),got=v>=g[3];h+='<div class="card goal'+(got?" got":"")+'"><div class="ico">'+I(g[0])+'</div><div style="flex:1"><div class="row"><b>'+g[1]+'</b><span class="mu">'+Math.min(v,g[3])+'/'+g[3]+'</span></div>'+bar(Math.min(v,g[3])/g[3])+'</div></div>'});
 var np="Notification" in window?Notification.permission:"off";
 h+='<h2>Rappels</h2><div class="card"><div class="row"><span>Heure de la séance</span><input type="time" value="'+S.remind+'" onchange="setRemind(this.value)"></div>'
  +(np=="granted"?'<p class="tip">Notifications activées.</p>':'<button class="sbtn" onclick="askNotif()">'+I("bell",20)+' Activer les notifications</button>')
  +'<a class="sbtn" href="'+icsHref()+'">'+I("cal",20)+' Ajouter l’alerte quotidienne au calendrier</a>'
  +'<p class="tip">L’alerte du calendrier sonne tous les jours à cette heure, même app fermée.</p></div>';return h}
function render(){var h=sel?session():tab=="home"?home():tab=="seances"?seances():goals();
 if(showModal){var s=streak();h+='<div style="position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9;padding:24px" onclick="showModal=false;sel=null;render()"><div class="card" style="text-align:center;max-width:320px"><div style="color:var(--ac)">'+I("trophy",64)+'</div><h1>Séance terminée</h1><p>Série : <b>'+s+' jour'+(s>1?"s":"")+'</b><br>Reviens demain pour la prolonger.</p><button class="btn">Continuer</button></div></div>'}
 function t(n,l,ic){return '<button class="'+(tab==n&&!(sel&&n!="home")?"on":"")+'" onclick="setTab(\''+n+'\')">'+I(ic,24)+l+'</button>'}
 document.getElementById("app").innerHTML=h+'<div class="tabs">'+t("home","Accueil","home")+t("seances","Séances","cal")+t("goals","Objectifs","trophy")+'</div>'}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});
render();tick();setInterval(tick,30000);
</script></body></html>
